services:

  python-app:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8096:80"
    depends_on:
      python-app:
        condition: service_healthy
    restart: unless-stopped
